############################################################
# Source & Input
############################################################
input: assets/Seq_035_b.mp4        # Video file, image directory, or "camera"
# input: assets/Seq_035_b_subset
img_glob: '*.png'                  # Pattern when reading from an image folder
skip: 1                            # Frame or image stride when iterating inputs
camid: 0                           # Camera index if using live capture

############################################################
# Model & Weights
############################################################
# model: MagicLeap                   # Oficial MAgicLeap

# weights_path: weights/MagicLeap/superpoint_v1.pth  # BASELINE MagicLeap SuperPoint

### Without mask_when_training
# weights_path: weights/MagicLeap/non_mask_when_training/01_ds4_th000075_nhom10_nms4_Magicleap_bs1_lr00001_th015_nms4_200000_checkpoint.pth    # MagicLeap fine-tuned
# weights_path: weights/MagicLeap/non_mask_when_training/02_ds4_th015_nhom100_nms4_Magicleap_bs1_lr00001_th015_nms4_200000_checkpoint.pth
# weights_path: weights/MagicLeap/non_mask_when_training/03_ds4_th015_nhom100_nms4_Magicleap_bs1_lr00001_th015_nms4_retrain_200000_checkpoint.pth
# weights_path: weights/MagicLeap/non_mask_when_training/04_ds4_th015_nms_4_bs8_lr000104_ds4_non_mask_th015_nhom10_nms_4_Magicleap_bs8_lr0001_th015_nms4_48865_checkpoint.pth
# weights_path: weights/MagicLeap/non_mask_when_training/05_ds4_th000075_nhom10_nms4_bs16_lr00001_th015_nms4_MagicLeap_200000_checkpoint.pth

model: SuperpointNet               # MagicLeap plus batchnorm
# weights_path: weights/SuperpointNet/superPointNet_200000_checkpoint.pth #BASELINE sp-pytorch

weights_path: weights/SuperpointNet/leon_esuperPointNet_400000_checkpoint.pth   # Leon s track adaptation

# model: SuperpointNet_gauss2      # SuperpoinTorch U-net variant

# weights_path: weights/SuperpointNet_gauss2/superPointNet_gauss2_170000_checkpoint.pth #BASELINE sp-pytorch

# Without mask_when_training
# weights_path: weights/SuperpointNet_gauss2/non_mask_when_training/06_ds4_th005_nhom50_nms6_SuperpointNet_gauss2_bs16_lr0001_th005_nms6_141039_checkpoint.pth   # SuperpointNet_gauss2

# mask_when_training
# weights_path: weights/SuperpointNet_gauss2/mask_when_training/07_ds4_th005_nhom50_nms6_SuperpointNet_gauss2_bs16_lr0001_th005_nms6_80000_checkpoint.pth
# weights_path: weights/SuperpointNet_gauss2/mask_when_training/08_ds4_th005_nhom50_nms6_SuperpointNet_gauss2_bs16_lr0001_th005_nms6_asmgrad_35000_checkpoint.pth

############################################################
# Frame Geometry & Visualization Scaling
############################################################
H: 270                             # 1080 / batch_size. If bs 4, H: 270
W: 360                             # 1440 / batch_size. If bs 4, W: 360
display_scale: 1                   # Multiplicative scale for display windows
no_display: false                  # Disable all OpenCV UI windows

############################################################
# Detector & Matcher Thresholds
############################################################
nms_dist: 4                        # Non-maximum suppression radius (pixels)
conf_thresh: 0.015                 # SuperPoint confidence threshold
nn_thresh: 0.7                     # Descriptor match threshold for tracking

############################################################
# Tracking Parameters
############################################################
min_length: 2                      # Drop tracks shorter than this many frames
max_length: 90                      # Sliding window length for the tracker

############################################################
# Visualization Toggles
############################################################
show_extra: false                  # Show additional debug panels (out2/out3)
show_keypoints: false              # Draw untracked keypoints on main view
waitkey: 1                         # OpenCV waitKey delay in ms (frame pacing)

############################################################
# Acceleration Backends
############################################################
cuda: false                        # Enable CUDA backend (if available)
mps: true                         # Enable Apple Metal Performance Shaders

############################################################
# Output & Logging
############################################################
write: false                       # Persist output frames to disk
write_dir: tracker_outputs/  # Destination directory when write=true
